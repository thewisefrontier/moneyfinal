name: 먼슬리 통합 수집
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1-5 * *'   # 매월 1~5일 09:00 KST (재시도 윈도우 - fetcher가 이미 성공했으면 자체 스킵)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: M2 유동성
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python fetchers/ecos_m2.py
      - name: 은행통계
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY_DEC }}
        run: python fetchers/bank_stats.py
      - name: 금융회사 건전성(BIS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY_DEC }}
        run: python fetchers/financial_corp_info.py
      - name: Export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python exporters/export_data.py
      - name: 커밋 및 배포
        run: |
          git config user.name "moneyfinal-bot"
          git config user.email "bot@moneyfinal.kr"
          git add data/
          git diff --staged --quiet || (git commit -m "data: $(date +'%Y-%m') monthly export" && git pull --rebase origin main && git push)
