# 일회용: 전 페이지 nav에 '시장'(market.html) 링크 삽입
# 실행 후 이 파일은 삭제 대상 (수동 삭제)
name: Nav Update (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nav-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert market link into nav
        run: |
          for f in *.html; do
            sed -i 's|투자</a><a href="savings.html"|투자</a><a href="market.html">시장</a><a href="savings.html"|' "$f"
          done
          echo "변경된 파일:"
          git diff --name-only

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: 전 페이지 nav에 시장 링크 추가"
          git push
