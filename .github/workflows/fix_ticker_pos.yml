name: fix-ticker-pos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: move ticker above header + add colors
        run: |
          python3 - <<'EOF'
          import glob
          TD='<div class="ticker"><div class="ticker-inner" id="ticker-inner"></div></div>'
          CC='.ticker .up{color:var(--green)}.ticker .down{color:var(--red)}.ticker .neutral{color:var(--text2)}\n'
          n=m=0
          for f in sorted(glob.glob('*.html')):
              src=open(f,encoding='utf-8').read()
              if TD not in src: continue
              orig=src
              if src.find(TD)>src.find('<header'):
                  src=src.replace('\n'+TD,'',1).replace('<header',TD+'\n<header',1)
                  assert src.find(TD)<src.find('<header') and src.count(TD)==1,f
                  n+=1
              if '.ticker .up' not in src and '.up{' not in src:
                  src=src.replace('</style>',CC+'</style>',1)
                  m+=1
              if src!=orig: open(f,'w',encoding='utf-8').write(src)
          print('moved:',n,'colored:',m)
          assert n==14 and m==2,(n,m)
          EOF
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: 티커 헤더 위로 이동 + insurance·savings 티커 색상 추가"
          git push
