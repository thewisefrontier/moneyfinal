name: fix-nav-links
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add nav links
        run: |
          cd $GITHUB_WORKSPACE
          f=$(grep -L 'loans.html' *.html || true)
          [ -n "$f" ] && sed -i 's|예금·적금</a>|예금·적금</a><a href="loans.html">대출</a>|' $f
          f=$(grep -L 'annuity.html' *.html || true)
          [ -n "$f" ] && sed -i 's|절세·연금</a>|절세·연금</a><a href="annuity.html">연금저축</a>|' $f
          sed -i 's|<a href="savings.html" class="active">절세·연금</a>|<a href="savings.html">절세·연금</a>|; s|<a href="annuity.html">연금저축</a>|<a href="annuity.html" class="active">연금저축</a>|' annuity.html
          echo "대출 링크: $(grep -l 'loans.html' *.html | wc -l) / 연금저축 링크: $(grep -l 'annuity.html' *.html | wc -l)"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: 전 페이지 nav에 대출·연금저축 링크 추가"
          git push
