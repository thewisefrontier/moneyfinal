name: 시크릿 감사

# 워크플로우나 코드가 바뀌면 docs/SECRETS.md 가 최신인지, 그리고
# 시크릿 매핑에 구멍이 없는지 검사한다. 시크릿 값 자체는 읽지 않는다.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'fetchers/**'
      - 'processors/**'
      - 'exporters/**'
      - 'utils/**'
      - 'scripts/audit_secrets.py'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 감사 실행
        run: python scripts/audit_secrets.py --check
