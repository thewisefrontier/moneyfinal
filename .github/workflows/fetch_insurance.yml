name: 실손보험
on:
  workflow_dispatch:
  schedule:
    # 매월 21~25일 09:00 KST (20~24일 24:00 UTC) — bank_rates보다 1시간 뒤, 동시 push 회피
    # 재시도 윈도우 (fetcher가 이미 성공했으면 자체 스킵)
    - cron: '0 0 21-25 * *'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      # 2026-09-04: apis.data.go.kr이 GitHub Actions 러너에서 전면 차단돼서
      # 로컬(scripts/local_daily_update.py)로 옮김. 러너에서 다시 뚫리면 복구.
      # - name: 실손보험 수집
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      #     DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY_DEC }}
      #   run: python fetchers/insurance_info.py
      - name: Export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python exporters/export_data.py
      - name: 커밋 및 배포
        run: |
          git config user.name "moneyfinal-bot"
          git config user.email "bot@moneyfinal.kr"
          git add data/
          git diff --staged --quiet || (git commit -m "data: insurance update" && git pull --rebase origin main && git push)
