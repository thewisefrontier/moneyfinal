name: MoneyFinal Daily Pipeline

on:
  schedule:
    - cron: '30 20 * * *'  # 매일 05:30 KST
  workflow_dispatch:        # 수동 실행 가능

permissions:
  contents: write           # git push 권한 자동 부여

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 1: 데이터 수집
      - name: Fetch bank rates (은행연합회)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSS_API_KEY: ${{ secrets.FSS_API_KEY }}
        run: python fetchers/bank_rates.py
        timeout-minutes: 10
        continue-on-error: true

      - name: Fetch macro indicators (한국은행 ECOS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python fetchers/ecos_macro.py
        timeout-minutes: 10
        continue-on-error: true

      - name: Fetch DART disclosures (금융감독원)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python fetchers/dart_disclosure.py
        timeout-minutes: 10
        continue-on-error: true

      - name: Fetch global indicators (FRED)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetchers/fred_global.py
        timeout-minutes: 10
        continue-on-error: true

      # Step 2: AI 정제 (Gemini)
      - name: Gemini analyze & generate briefing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python processors/gemini_analyzer.py
        timeout-minutes: 20
        continue-on-error: true

      # Step 3: JSON export
      - name: Export data to JSON
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python exporters/export_data.py
        timeout-minutes: 10

      # Step 4: 레포에 JSON 커밋
      - name: Commit & push JSON data
        run: |
          git config user.name "moneyfinal-bot"
          git config user.email "bot@moneyfinal.kr"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date +'%Y-%m-%d') 자동 업데이트"
          git push
