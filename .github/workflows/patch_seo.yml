name: 임시-SEO일괄패치
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: SEO 일괄 패치 실행
        run: python patch_seo.py
      - name: 커밋 및 배포
        run: |
          git config user.name "moneyfinal-bot"
          git config user.email "bot@moneyfinal.kr"
          git add *.html
          git diff --staged --quiet || (git commit -m "seo: 전체 페이지 canonical/og/twitter/JSON-LD/favicon/footer 링크 일괄 적용" && git pull --rebase origin main && git push)
