name: 임시-계산기SEO패치
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: SEO 패치 실행
        run: python patch_seo.py
      - name: 커밋 및 배포
        run: |
          git config user.name "moneyfinal-bot"
          git config user.email "bot@moneyfinal.kr"
          git add calc*.html
          git diff --staged --quiet || (git commit -m "seo: 계산기 페이지 canonical/og/twitter/JSON-LD 일괄 추가" && git pull --rebase origin main && git push)
