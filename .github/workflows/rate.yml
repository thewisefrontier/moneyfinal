name: 기준금리 (주간 점검)
on:
  workflow_dispatch:
  schedule:
    # 금통위 회의일을 하드코딩해서 그 앞뒤로만 돌리던 방식은 실제 회의 일정이
    # (임시회의·일정변경 등으로) 하드코딩값과 어긋나면 다음 발표까지 몇 주씩
    # 조용히 갱신이 끊기는 문제가 있었음 (2026-07-28 인상분을 8/27까지 놓침).
    # 회의 일정을 추정하지 않고 매주 점검하는 방식으로 변경 - fetcher가 이미
    # 이번 값을 수집했으면 자체 스킵하므로 매주 돌려도 비용 부담 없음.
    - cron: '0 23 * * 1'  # 매주 월요일 08:00 KST
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: 기준금리
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python fetchers/ecos_base_rate.py
      - name: Export
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python exporters/export_data.py
      - name: 커밋 및 배포
        run: |
          git config user.name "moneyfinal-bot"
          git config user.email "bot@moneyfinal.kr"
          git add data/
          git diff --staged --quiet || (git commit -m "data: base rate update" && git pull --rebase origin main && git push)
