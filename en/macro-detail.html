<style>:root[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#388bfd;--accent:#388bfd}
:root[data-theme="light"]{--bg:#fff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--blue:#0969da;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:30px;z-index:100}
.logo{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-0.5px;white-space:nowrap;flex-shrink:0}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}nav::-webkit-scrollbar{display:none}nav a{flex-shrink:0}
nav a{color:var(--text2);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
nav a:hover,nav a.active{color:var(--text);background:var(--bg3)}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
@media(max-width:860px){.menu-btn{display:block}nav{display:none;position:fixed;top:82px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--border);flex-direction:column;gap:0;padding:8px;max-height:calc(100vh - 82px);overflow-y:auto;z-index:102}nav.open{display:flex}nav a{padding:12px 14px;width:100%}}
main{max-width:900px;margin:0 auto;padding:24px 16px}
.crumb{font-size:12px;color:var(--text2);margin-bottom:10px}
.crumb a{color:var(--accent)}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
.toolbar{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center}
.search-box{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--text);font-size:13px;outline:none}
.result-cnt{font-size:12px;color:var(--text2);white-space:nowrap}
.row{display:grid;grid-template-columns:1fr auto;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.ind-name{font-size:13px;font-weight:500}
.ind-sub{font-size:11px;color:var(--text2);margin-top:2px}
.ind-val{font-size:14px;font-weight:700;text-align:right}
.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--text2)}
.empty{color:var(--text2);text-align:center;padding:40px;font-size:13px}
footer{border-top:1px solid var(--border);padding:20px;text-align:center;font-size:11px;color:var(--text2);margin-top:40px}
.ticker{background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;height:30px;display:flex;align-items:center;position:sticky;top:0;z-index:101}
.ticker-inner{display:flex;gap:28px;animation:ticker 50s linear infinite;white-space:nowrap;padding:0 16px}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.ti .name{color:var(--text);font-weight:500}
.qrow{position:relative;flex:1;min-width:150px}
.qrow input{width:100%;padding-right:44px;box-sizing:border-box}
.qgo{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--text2);cursor:pointer;padding:6px 8px;border-radius:6px;display:flex;align-items:center}
.qgo:hover,.qgo:focus-visible{color:var(--accent);background:var(--bg3);outline:none}
</style>

<main>
<div class="crumb"><a href="/en/macro.html">Economic indicators</a> &gt; <span id="crumb-name">View all</span></div>
<h1 id="page-title">-</h1>

  <div class="toolbar">
    <div class="qrow"><input type="text" class="search-box" id="q" placeholder="Search" oninput="render()"><button class="qgo" type="button" aria-label="Search" title="Search" onclick="var i=document.getElementById('q');i.focus();i.dispatchEvent(new Event('input',{bubbles:true}))"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></div>

<script src="/theme.js"></script><script>

function fmt(v,d=2){if(v===null||v===undefined)return'-';const n=parseFloat(v);if(isNaN(n))return'-';return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function sc(s){return s==='red'?'down':s==='yellow'?'neutral':'up'}
function krWon(v,unit){const n=parseFloat(v);if(isNaN(n))return'-';const mult={'백만원':1e6,'십억원':1e9,'원':1}[unit]||1;const abs=Math.abs(n*mult);const t=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']].find(x=>abs>=x[0]);const s=t?(abs/t[0]).toFixed(abs/t[0]>=100?0:abs/t[0]>=10?1:2)+t[1]:String(Math.round(abs));return(n<0?'-':'')+'₩'+s;}
  if(jo&&eok)return `${sign}₩${jo.toLocaleString('en-US')}T ${eok.toLocaleString('en-US')}00M`;
  if(jo)return `${sign}₩${jo.toLocaleString('en-US')}T`;
  if(eok)return `${sign}₩${eok.toLocaleString('en-US')}00M`;
  return `${sign}₩${Math.round(won).toLocaleString('en-US')}`;}
function valText(i){
  if(['백만원','십억원','원'].includes(i.unit)&&Math.abs(i.value*({'백만원':1e6,'십억원':1e9,'원':1}[i.unit]))>=1e8)return krWon(i.value,i.unit);
  if(i.unit==='달러'&&Math.abs(i.value)>=1e8){const abs=Math.abs(i.value);const t=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']].find(x=>abs>=x[0]);const s=t?(abs/t[0]).toFixed(abs/t[0]>=100?0:abs/t[0]>=10?1:2)+t[1]:String(Math.round(abs));return (i.value<0?'-':'')+'$'+s;}
  return fmt(i.value,i.unit==='%'?2:0)+(i.unit&&i.unit!=='%'?' '+i.unit:i.unit==='%'?'%':'');
}

const CAT=new URLSearchParams(location.search).get('cat')||'';
const TITLES={
  '은행통계':['Bank soundness (BIS)','All banks’ BIS total capital, Tier 1 and common equity Tier 1 ratios'],
  '금융회사건전성':['Financial company debt ratios','All soundness reference indicators for non-bank financial companies'],
  '채권금리':['Bond yields (YTM)','Quotes for all Korean bonds by issue'],
  '금융투자':['Financial investment association statistics','All statistics on trusts, funds, credit extensions and more']
};
const[title,sub]=TITLES[CAT]||['View all',''];
document.getElementById('page-title').textContent=title;
document.getElementById('page-sub').textContent=sub;
document.getElementById('crumb-name').textContent=title;
document.title=title+' | MoneyFinal';

let ALL=[];
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let list=ALL;
  if(q)list=list.filter(i=>(i.indicator_name||'').toLowerCase().includes(q));
  document.getElementById('cnt').textContent=list.length+' trades';
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class="empty">No data</div>';return;}
  el.innerHTML=list.map(i=>{
    const sub=i.summary_text||(i.reference_date?`as of ${i.reference_date}`:'');
    return `<div class="row"><div><div class="ind-name">${i.indicator_name}</div>${sub?`<div class="ind-sub">${sub}</div>`:''}</div><div class="ind-val ${sc(i.signal)}">${valText(i)}</div></div>`;
  }).join('');
}

async function load(){
  try{
    const r=await fetch('/data/market.json');const d=await r.json();
    ALL=((d.by_category||{})[CAT]||[]).slice();
    if(CAT==='은행통계')ALL=ALL.filter(i=>i.indicator_name.endsWith('BIS기준 자기자본비율')||true); 
    ALL.sort((a,b)=>(b.value||0)-(a.value||0));
    render();
  }catch(e){document.getElementById('list').innerHTML='<div class="empty">Could not load data</div>';}
}
load();

</script><script src="/ticker.js"></script>
