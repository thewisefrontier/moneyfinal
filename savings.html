<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>절세·연금 | 머니파이널</title>
<style>:root[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#388bfd;--accent:#388bfd}
:root[data-theme="light"]{--bg:#fff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--blue:#0969da;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:30px;z-index:100}
.logo{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-0.5px}
nav{display:flex;gap:2px}
nav a{color:var(--text2);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
nav a:hover,nav a.active{color:var(--text);background:var(--bg3)}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";display:block;width:3px;height:16px;background:var(--accent);border-radius:2px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--border)}
.card-title{font-size:13px;font-weight:600}
.filter-tabs{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ft{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.ft.active,.ft:hover{border-color:var(--accent);color:var(--accent);background:rgba(56,139,253,.1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.row{display:grid;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.loading{color:var(--text2);font-size:13px;padding:20px;text-align:center}
.empty{color:var(--text2);font-size:13px;padding:40px;text-align:center}
.disclaimer{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:11px;color:var(--text2);text-align:center;margin-top:24px}
footer{border-top:1px solid var(--border);padding:20px;text-align:center;font-size:11px;color:var(--text2);margin-top:40px}
.ticker{background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;height:30px;display:flex;align-items:center;position:sticky;top:0;z-index:101}
.ticker-inner{display:flex;gap:28px;animation:ticker 50s linear infinite;white-space:nowrap;padding:0 16px}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.ti .name{color:var(--text);font-weight:500}
.rate-row{grid-template-columns:2fr 1fr auto}
.rb{font-size:13px;font-weight:600}
.rp{font-size:11px;color:var(--text2);margin-top:2px}
.period{font-size:11px;color:var(--text2);background:var(--bg3);padding:2px 8px;border-radius:4px;text-align:center;align-self:center}
.rmax{font-size:15px;font-weight:700;color:var(--green);text-align:right}
.rbase{font-size:11px;color:var(--text2);text-align:right;margin-top:2px}
.isa-row{grid-template-columns:1fr auto}
.isa-name{font-size:13px;font-weight:600}
.isa-sub{font-size:11px;color:var(--text2);margin-top:2px}
.isa-val{font-size:15px;font-weight:700;color:var(--green);text-align:right}
.isa-val.amt{color:var(--blue)}
.ticker .up{color:var(--green)}.ticker .down{color:var(--red)}.ticker .neutral{color:var(--text2)}
</style>
</head>
<body>
<div class="ticker"><div class="ticker-inner" id="ticker-inner"></div></div>
<header><a href="index.html" class="logo">💰 머니파이널</a>
  <nav><a href="index.html">홈</a><a href="rates.html">예금·적금</a><a href="loans.html">대출</a><a href="invest.html">투자</a><a href="market.html">시장</a><a href="savings.html" class="active">절세·연금</a><a href="annuity.html">연금저축</a><a href="insurance.html">보험</a><a href="company.html">기업정보</a><a href="macro.html">경제지표</a><a href="calc.html">계산기</a></nav>
  <div><button class="theme-btn" onclick="toggleTheme()">🌙</button></div></header>
<main>
<div class="sec-hd"><div class="sec-title">CMA / 파킹통장</div></div>
<div class="card" style="margin-bottom:24px">
  <div class="card-hd"><span class="card-title">수시 입출금 고금리 상품</span></div>
  <div class="filter-tabs">
    <button class="ft active" onclick="filterCMA('all',this)">전체</button>
    <button class="ft" onclick="filterCMA('CMA',this)">CMA</button>
    <button class="ft" onclick="filterCMA('파킹통장',this)">파킹통장</button>
  </div>
  <div id="cma-list"><div class="loading">로딩 중...</div></div>
</div>
<div class="grid2">
  <div>
    <div class="sec-hd"><div class="sec-title">ISA (개인종합자산관리)</div></div>
    <div class="card"><div class="card-hd"><span class="card-title">ISA 다모아</span></div>
      <div id="isa-list"><div class="loading">로딩 중...</div></div></div>
  </div>
  <div>
    <div class="sec-hd"><div class="sec-title">펀드 상품</div></div>
    <div class="card"><div class="card-hd"><span class="card-title">수익률 기준</span></div>
      <div id="fund-list"><div class="loading">로딩 중...</div></div></div>
  </div>
</div>
</main>
<div class="disclaimer">⚠️ 본 사이트는 공공데이터 기반 참고 정보만 제공하며, 투자 판단 및 손실에 대한 책임은 이용자 본인에게 있습니다.<br>데이터 출처: 금융감독원 · 한국은행 ECOS · 미국 연준 FRED · 공공데이터포털</div>
<footer>© 2026 머니파이널 · 세상의 모든 재테크</footer>
<script>
function toggleTheme(){const h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');document.querySelector('.theme-btn').textContent=h.getAttribute('data-theme')==='dark'?'🌙':'🌑';}
function fmt(v,u='',d=2){if(v===null||v===undefined)return'-';const n=parseFloat(v);if(isNaN(n))return'-';return n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d})+(u?' '+u:'');}
function fmtWon(v){const n=parseFloat(v);if(isNaN(n))return'-';if(n>=1e12)return(n/1e12).toLocaleString('ko-KR',{maximumFractionDigits:1})+'조원';if(n>=1e8)return(n/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0})+'억원';return n.toLocaleString('ko-KR')+'원';}
function sc(s){return s==='red'?'down':s==='yellow'?'neutral':'up'}
let cmaAll=[];
function cmaHtml(list){if(!list.length)return '<div class="empty">CMA/파킹 데이터 수집 예정</div>';return list.slice(0,20).map((r,i)=>`<div class="row rate-row"><div><div class="rb">${i+1}. ${r.institution}</div><div class="rp">${r.product_name}</div></div><div class="period">${r.period||'수시'}</div><div><div class="rmax">${fmt(r.max_rate,'%')}</div><div class="rbase">기본 ${fmt(r.rate,'%')}</div></div></div>`).join('');}
function filterCMA(kw,btn){btn.closest('.filter-tabs').querySelectorAll('.ft').forEach(t=>t.classList.remove('active'));btn.classList.add('active');document.getElementById('cma-list').innerHTML=cmaHtml(kw==='all'?cmaAll:cmaAll.filter(r=>r.category===kw));}
async function loadSavings(){
  try{const r=await fetch('data/rates.json');const d=await r.json();const bc=d.by_category||{};cmaAll=[...(bc['CMA']||[]),...(bc['파킹통장']||[])];document.getElementById('cma-list').innerHTML=cmaHtml(cmaAll);
    const fund=bc['펀드']||[];document.getElementById('fund-list').innerHTML=fund.length?fund.slice(0,10).map((r,i)=>`<div class="row rate-row"><div><div class="rb">${i+1}. ${r.institution}</div><div class="rp">${r.product_name}</div></div><div class="period">${r.period||'3개월'}</div><div><div class="rmax">${fmt(r.max_rate,'%')}</div></div></div>`).join(''):'<div class="empty">펀드 데이터 수집 예정</div>';
  }catch(e){document.getElementById('cma-list').innerHTML='<div class="empty">데이터 없음</div>';document.getElementById('fund-list').innerHTML='<div class="empty">데이터 없음</div>';}
  try{const r=await fetch('data/market.json');const d=await r.json();const bc=d.by_category||{};
    const isa=(bc['ISA']||[]).slice().sort((a,b)=>((a.unit==='원')?1:0)-((b.unit==='원')?1:0));
    document.getElementById('isa-list').innerHTML=isa.length?isa.slice(0,15).map(i=>{
      const isAmt=i.unit==='원';
      const val=isAmt?fmtWon(i.value):fmt(i.value,'%');
      const name=isAmt?(i.indicator_name||i.summary_text):(i.indicator_name||i.summary_text);
      const sub=[i.summary_text&&i.summary_text!==name?i.summary_text:'',i.reference_date||''].filter(Boolean).join(' · ');
      return `<div class="row isa-row"><div><div class="isa-name">${name}</div><div class="isa-sub">${sub}</div></div><div class="isa-val${isAmt?' amt':''}">${val}</div></div>`;
    }).join(''):'<div class="empty">ISA 데이터 수집 예정</div>';
  }catch(e){document.getElementById('isa-list').innerHTML='<div class="empty">데이터 없음</div>';}
}
loadSavings();
async function loadTicker(){try{const r=await fetch('data/market.json');const d=await r.json();const inds=d.indicators||[];const L={'USD_KRW':'원달러','BASE_RATE':'기준금리','FED_RATE':'미국금리','USD_INDEX':'달러인덱스','US_YIELD_CURVE':'장단기금리차','M2_TOTAL':'M2','KOSPI':'코스피','KOSDAQ':'코스닥','US_SP500':'S&P500','US_DJIA':'다우','US_NASDAQ':'나스닥'};const tf=(v,dg)=>parseFloat(v).toLocaleString('ko-KR',{minimumFractionDigits:dg,maximumFractionDigits:dg});const tc=s=>s==='red'?'down':s==='yellow'?'neutral':'up';let h='';inds.forEach(i=>{if(!L[i.indicator_code])return;const v=i.indicator_code==='M2_TOTAL'?(i.value/1000000).toFixed(1)+'조원':tf(i.value,['%','Index','pt','USD/배럴'].includes(i.unit)?2:0)+(i.unit?' '+i.unit:'');h+=`<div class="ti"><span class="name">${L[i.indicator_code]}</span><span class="${tc(i.signal)}">${v}</span></div>`;});document.getElementById('ticker-inner').innerHTML=h+h;}catch(e){}}
loadTicker();
</script>
</body>
</html>
