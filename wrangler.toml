name = "moneyfinal"
compatibility_date = "2026-09-01"
pages_build_output_dir = "."

# Cloudflare Pages Functions(functions/api/*.js)가 사용하는 D1 바인딩.
# wrangler d1 create moneyfinal-db 실행 완료, APAC 리전으로 생성됨 (2026-09-23).
[[d1_databases]]
binding = "DB"
database_name = "moneyfinal-db"
database_id = "c22e0a66-445f-4332-b8b7-f409f6c530c9"

# 참고: 이 프로젝트는 Git 연동(자동 배포) 방식이라 `wrangler pages deploy`를 직접
# 실행하지 않는다. Pages Git 연동 빌드가 이 파일의 [[d1_databases]]를 자동으로
# 읽어가는지는 계정/버전에 따라 다를 수 있으므로, 배포 후 Cloudflare 대시보드
# (Pages 프로젝트 → Settings → Functions → D1 database bindings)에서 바인딩 이름
# "DB"가 실제로 연결되어 있는지 반드시 확인할 것. 안 잡혀 있으면 대시보드에서
# 수동으로 같은 이름("DB")으로 추가해야 functions/api/*.js의 env.DB가 동작한다.
