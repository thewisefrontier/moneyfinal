<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기업정보 | 머니파이널</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0d1117; --bg2: #161b22; --bg3: #1c2128;
      --border: #30363d; --text: #e6edf3; --text2: #8b949e;
      --green: #3fb950; --red: #f85149; --yellow: #d29922; --blue: #388bfd; --accent: #388bfd;
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2;
      --border: #d0d7de; --text: #1f2328; --text2: #656d76;
      --green: #1a7f37; --red: #cf222e; --yellow: #9a6700; --blue: #0969da; --accent: #0969da;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

    header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); text-decoration: none; letter-spacing: -0.5px; }
    nav { display: flex; gap: 4px; }
    nav a { color: var(--text2); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: all 0.15s; }
    nav a:hover, nav a.active { color: var(--text); background: var(--bg3); }
    .theme-btn { background: none; border: 1px solid var(--border); color: var(--text2); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }

    main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ''; display: block; width: 3px; height: 16px; background: var(--accent); border-radius: 2px; }

    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 32px; }
    .card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-size: 13px; font-weight: 600; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .badge-blue { background: rgba(56,139,253,0.15); color: var(--blue); }
    .badge-red { background: rgba(248,81,73,0.15); color: var(--red); }
    .badge-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }

    /* 공시 목록 */
    .disclosure-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      transition: background 0.1s;
      text-decoration: none;
      color: inherit;
    }
    .disclosure-row:last-child { border-bottom: none; }
    .disclosure-row:hover { background: var(--bg3); }
    .disc-date { font-size: 11px; color: var(--text2); white-space: nowrap; }
    .disc-company { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .disc-type { font-size: 11px; color: var(--text2); }
    .disc-link {
      font-size: 11px; color: var(--accent);
      text-decoration: none; white-space: nowrap;
      padding: 4px 8px; border: 1px solid var(--accent);
      border-radius: 4px; transition: all 0.15s;
    }
    .disc-link:hover { background: var(--accent); color: white; }

    /* 필터 탭 */
    .filter-tabs { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .filter-tab {
      font-size: 12px; padding: 4px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: none;
      color: var(--text2); cursor: pointer; transition: all 0.15s;
    }
    .filter-tab.active, .filter-tab:hover { border-color: var(--accent); color: var(--accent); background: rgba(56,139,253,0.1); }

    /* 통계 요약 */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--text2); }

    .loading { color: var(--text2); font-size: 13px; padding: 20px 16px; text-align: center; }
    .empty { color: var(--text2); font-size: 13px; padding: 40px 16px; text-align: center; }

    .disclaimer { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 11px; color: var(--text2); text-align: center; margin-top: 32px; }
    footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 11px; color: var(--text2); margin-top: 40px; }

    .type-badge {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      font-weight: 500; display: inline-block; margin-top: 3px;
    }
    .type-주요사항 { background: rgba(56,139,253,0.15); color: var(--blue); }
    .type-불성실 { background: rgba(248,81,73,0.15); color: var(--red); }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">💰 머니파이널</a>
  <nav>
    <a href="index.html">홈</a>
    <a href="rates.html">금리</a>
    <a href="market.html">투자</a>
    <a href="alerts.html" class="active">기업정보</a>
  </nav>
  <div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main>

  <!-- 통계 요약 -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="stat-total">-</div>
      <div class="stat-label">수집된 공시</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--red)" id="stat-insincere">-</div>
      <div class="stat-label">불성실 공시</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--blue)" id="stat-major">-</div>
      <div class="stat-label">주요사항보고</div>
    </div>
  </div>

  <!-- 공시 목록 -->
  <div class="section-header">
    <div class="section-title">기업 공시 현황</div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">DART 공시 목록</span>
      <span class="badge badge-blue">금융감독원 DART</span>
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterAlerts('all', this)">전체</button>
      <button class="filter-tab" onclick="filterAlerts('불성실', this)">불성실 공시</button>
      <button class="filter-tab" onclick="filterAlerts('주요사항', this)">주요사항보고</button>
      <button class="filter-tab" onclick="filterAlerts('유상증자', this)">유상증자</button>
      <button class="filter-tab" onclick="filterAlerts('전환사채', this)">전환사채</button>
    </div>
    <div id="alerts-list"><div class="loading">데이터 로딩 중...</div></div>
  </div>

  <div class="disclaimer">
    ⚠️ 본 사이트는 공공데이터 기반 참고 정보만 제공하며, 투자 판단 및 손실에 대한 책임은 이용자 본인에게 있습니다.<br>
    데이터 출처: 금융감독원 DART 공공데이터
  </div>

</main>

<footer>© 2026 머니파이널 | 세상의 모든 재테크</footer>

<script>
  let allAlerts = [];

  function toggleTheme() {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    document.querySelector('.theme-btn').textContent = html.getAttribute('data-theme') === 'dark' ? '🌙' : '🌑';
  }

  function getTypeClass(alertType) {
    if (alertType.includes('불성실')) return 'type-불성실';
    return 'type-주요사항';
  }

  function getTypeBadge(alertType) {
    if (alertType.includes('불성실')) return '불성실공시';
    if (alertType.includes('유상증자')) return '유상증자';
    if (alertType.includes('전환사채')) return '전환사채';
    if (alertType.includes('주요사항')) return '주요사항';
    return '공시';
  }

  function renderAlerts(alerts) {
    const el = document.getElementById('alerts-list');
    if (!alerts.length) {
      el.innerHTML = '<div class="empty">해당 조건의 공시가 없습니다.</div>';
      return;
    }
    el.innerHTML = alerts.map(a => `
      <a class="disclosure-row" href="${a.dart_url || '#'}" target="_blank" rel="noopener">
        <div class="disc-date">${a.disclosure_date || '-'}</div>
        <div>
          <div class="disc-company">${a.company_name}</div>
          <div class="disc-type">${a.alert_type}</div>
          <span class="type-badge ${getTypeClass(a.alert_type)}">${getTypeBadge(a.alert_type)}</span>
        </div>
        <a href="${a.dart_url || '#'}" target="_blank" class="disc-link" onclick="event.stopPropagation()">DART →</a>
      </a>
    `).join('');
  }

  function filterAlerts(keyword, btn) {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    if (keyword === 'all') {
      renderAlerts(allAlerts);
    } else {
      renderAlerts(allAlerts.filter(a =>
        a.alert_type.includes(keyword) ||
        a.company_name.includes(keyword)
      ));
    }
  }

  async function loadAlerts() {
    try {
      const res = await fetch('data/alerts.json');
      const data = await res.json();
      allAlerts = data.alerts || [];

      // 통계
      document.getElementById('stat-total').textContent = allAlerts.length;
      document.getElementById('stat-insincere').textContent =
        allAlerts.filter(a => a.alert_type.includes('불성실')).length;
      document.getElementById('stat-major').textContent =
        allAlerts.filter(a => !a.alert_type.includes('불성실')).length;

      renderAlerts(allAlerts);
    } catch(e) {
      document.getElementById('alerts-list').innerHTML = '<div class="empty">데이터를 불러올 수 없습니다.</div>';
    }
  }

  loadAlerts();
</script>
</body>
</html>
