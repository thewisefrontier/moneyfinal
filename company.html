<style>:root[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#388bfd;--accent:#388bfd}
:root[data-theme="light"]{--bg:#fff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--text2:#656d76;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--blue:#0969da;--accent:#0969da}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:30px;z-index:100}
.logo{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-0.5px;white-space:nowrap;flex-shrink:0}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}nav::-webkit-scrollbar{display:none}nav a{flex-shrink:0}
nav a{color:var(--text2);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
nav a:hover,nav a.active{color:var(--text);background:var(--bg3)}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
@media(max-width:860px){.menu-btn{display:block}nav{display:none;position:fixed;top:82px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--border);flex-direction:column;gap:0;padding:8px;max-height:calc(100vh - 82px);overflow-y:auto;z-index:102}nav.open{display:flex}nav a{padding:12px 14px;width:100%}}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";display:block;width:3px;height:16px;background:var(--accent);border-radius:2px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--border)}
.card-title{font-size:13px;font-weight:600}
.filter-tabs{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ft{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text2);cursor:pointer;transition:all .15s}
.ft.active,.ft:hover{border-color:var(--accent);color:var(--accent);background:rgba(56,139,253,.1)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
@media(max-width:600px){.grid3{grid-template-columns:1fr}}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;transition:border-color .15s}
.kpi:hover{border-color:var(--accent)}
.kpi-label{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.kpi-value{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.row{display:grid;padding:10px 16px;border-bottom:1px solid var(--border);align-items:center;transition:background .1s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--text2)}
.loading{color:var(--text2);font-size:13px;padding:20px;text-align:center}
.empty{color:var(--text2);font-size:13px;padding:40px;text-align:center}
.disclaimer{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:11px;color:var(--text2);text-align:center;margin-top:24px}
footer{border-top:1px solid var(--border);padding:20px;text-align:center;font-size:11px;color:var(--text2);margin-top:40px}
.ticker{background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;height:30px;display:flex;align-items:center;position:sticky;top:0;z-index:101}
.ticker-inner{display:flex;gap:28px;animation:ticker 50s linear infinite;white-space:nowrap;padding:0 16px}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ti{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.ti .name{color:var(--text);font-weight:500}
.disc-row{grid-template-columns:auto 1fr auto;gap:16px}
.disc-date{font-size:11px;color:var(--text2);white-space:nowrap}
.disc-co{font-size:13px;font-weight:600}
.disc-type{font-size:11px;color:var(--text2)}
.dart-link{font-size:11px;color:var(--accent);padding:3px 8px;border:1px solid var(--accent);border-radius:4px;transition:all .15s}
.dart-link:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="ticker"><div class="ticker-inner" id="ticker-inner"></div></div>
<header><a href="index.html" class="logo">💰 머니파이널</a>
  <nav><a href="index.html">홈</a><a href="invest.html">투자</a><a href="dividend-etf.html">배당ETF</a><a href="rates.html">예금·적금</a><a href="loans.html">대출</a><a href="market.html">시장</a><a href="savings.html">절세·연금</a><a href="annuity.html">연금저축</a><a href="insurance.html">보험</a><a href="company.html" class="active">기업정보</a><a href="macro.html">경제지표</a><a href="calc.html">계산기</a></nav>
  <div style="display:flex;gap:6px"><button class="theme-btn" onclick="toggleTheme()">🌙</button><button class="menu-btn" onclick="toggleNav()">☰</button></div></header>
<main>
<div class="grid3">
  <div class="kpi" style="text-align:center"><div class="kpi-value" id="st-total">-</div><div class="kpi-label" style="margin:0">수집된 공시</div></div>
  <div class="kpi" style="text-align:center"><div class="kpi-value down" id="st-insincere">-</div><div class="kpi-label" style="margin:0">불성실 공시</div></div>
  <div class="kpi" style="text-align:center"><div class="kpi-value up" id="st-major">-</div><div class="kpi-label" style="margin:0">주요사항보고</div></div>
</div>
<div class="sec-hd"><div class="sec-title">기업 공시 현황</div></div>
<div class="card" style="margin-bottom:24px">
  <div class="card-hd"><span class="card-title">DART 공시 · 권리일정</span></div>
  <div class="filter-tabs">
    <button class="ft active" onclick="filterA('all',this)">전체</button>
    <button class="ft" onclick="filterA('불성실',this)">불성실 공시</button>
    <button class="ft" onclick="filterA('주요사항',this)">주요사항보고</button>
    <button class="ft" onclick="filterA('유상증자',this)">유상증자</button>
    <button class="ft" onclick="filterA('전환사채',this)">전환사채</button>
    <button class="ft" onclick="filterA('권리일정',this)">권리일정</button>
  </div>
  <div id="alerts-list"><div class="loading">로딩 중...</div></div>
</div>
</main>
<div class="disclaimer">⚠️ 본 사이트는 공공데이터 기반 참고 정보만 제공하며, 투자 판단 및 손실에 대한 책임은 이용자 본인에게 있습니다.<br>데이터 출처: 금융감독원 DART · 공공데이터포털 · 한국은행 ECOS · 미국 연준 FRED</div>
<footer>© 2026 머니파이널 · 세상의 모든 재테크<br><a href="about.html">사이트 소개</a> · <a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a></footer>
<script>
function toggleNav(){const n=document.querySelector('nav');if(n)n.classList.toggle('open');}
function toggleTheme(){const h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');document.querySelector('.theme-btn').textContent=h.getAttribute('data-theme')==='dark'?'🌙':'🌑';}
let alertsAll=[];
function alertHtml(list){if(!list.length)return '<div class="empty">데이터 없음</div>';return list.slice(0,50).map(a=>`<a class="row disc-row" href="${a.dart_url||'#'}" target="_blank" rel="noopener"><div class="disc-date">${a.disclosure_date||'-'}</div><div><div class="disc-co">${a.company_name||'-'}</div><div class="disc-type">${a.alert_type||'-'}</div></div><span class="dart-link" onclick="event.stopPropagation()">상세 →</span></a>`).join('');}
function filterA(kw,btn){btn.closest('.filter-tabs').querySelectorAll('.ft').forEach(t=>t.classList.remove('active'));btn.classList.add('active');document.getElementById('alerts-list').innerHTML=alertHtml(kw==='all'?alertsAll:alertsAll.filter(a=>(a.alert_type||'').includes(kw)));}
async function loadCompany(){
  try{const r=await fetch('data/alerts.json');const d=await r.json();alertsAll=d.alerts||[];document.getElementById('st-total').textContent=alertsAll.length;document.getElementById('st-insincere').textContent=alertsAll.filter(a=>(a.alert_type||'').includes('불성실')).length;document.getElementById('st-major').textContent=alertsAll.filter(a=>(a.alert_type||'').includes('주요사항')).length;document.getElementById('alerts-list').innerHTML=alertHtml(alertsAll);}catch(e){document.getElementById('alerts-list').innerHTML='<div class="empty">공시 데이터 없음</div>';}
}
loadCompany();
async function loadTicker(){try{const r=await fetch('data/market.json');const d=await r.json();const inds=d.indicators||[];const L={'USD_KRW':'원달러','BASE_RATE':'기준금리','FED_RATE':'미국금리','USD_INDEX':'달러인덱스','US_YIELD_CURVE':'장단기금리차','M2_TOTAL':'M2','KOSPI':'코스피','KOSDAQ':'코스닥','US_SP500':'S&P500','US_DJIA':'다우','US_NASDAQ':'나스닥'};const tf=(v,dg)=>parseFloat(v).toLocaleString('ko-KR',{minimumFractionDigits:dg,maximumFractionDigits:dg});const tc=s=>s==='red'?'down':s==='yellow'?'neutral':'up';let h='';inds.forEach(i=>{if(!L[i.indicator_code])return;const v=i.indicator_code==='M2_TOTAL'?(i.value/1000000).toFixed(1)+'조원':tf(i.value,['%','Index','pt','USD/배럴'].includes(i.unit)?2:0)+(i.unit?' '+i.unit:'');h+=`<div class="ti"><span class="name">${L[i.indicator_code]}</span><span class="${tc(i.signal)}">${v}</span></div>`;});document.getElementById('ticker-inner').innerHTML=h+h;}catch(e){}}
loadTicker();
</script>
